name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python tests (v2-weasyprint, v3-typst)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: v3-typst/requirements.txt

      # Pinned so a new ruff release cannot change the default rule set under us.
      - name: Lint (ruff)
        run: |
          python -m pip install ruff==0.17.1
          ruff check .

      - name: v2-weasyprint glossary tests (stdlib only)
        run: python -m unittest discover -s v2-weasyprint -p 'test_*.py' -v

      - name: Install v3-typst test dependencies
        run: python -m pip install -r v3-typst/requirements.txt

      - name: v3-typst pytest
        working-directory: v3-typst
        run: python -m pytest -q

      # Imports every script in a temp cwd/HOME and fails if anything is written.
      - name: Import side-effect test (all scripts)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
